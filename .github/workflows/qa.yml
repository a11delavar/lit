name: 🔍 Quality Assurance

on:
  workflow_dispatch:
  workflow_call:

jobs:
  type-check:
    name: 🏗️ Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typescript

  lint:
    name: 📝 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: READMEs are up to date
        run: |
          npm run --silent readme
          git diff --exit-code -- '*.md' || { echo '::error::The generated sections of the READMEs are out of date. Run "npm run readme" and commit the result.'; exit 1; }

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test